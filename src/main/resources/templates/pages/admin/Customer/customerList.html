<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::body})}">
<body>
<div th:fragment="content" class="flex-1 overflow-auto p-6">
    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Customer</h2>
                <div class="flex space-x-3">
                    <button id="addCustomerBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        Add Customer
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">First Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Adress</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                    </thead>
                    <tbody th:each="customer : ${customers}" class="bg-white divide-y divide-gray-200">
                    <tr class="hover:bg-gray-50">
                        <td th:text="${customer.customerId}" class="px-6 py-4 text-sm font-medium text-gray-900"></td>
                        <td th:text="${customer.firstName}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${customer.lastName}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${customer.email}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${customer.phone}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${customer.address}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td class="px-6 py-4 text-sm font-medium">
                            <div class="flex space-x-3">
                                <button type="button"
                                        th:data-id="${customer.customerId}"
                                        th:data-firstname="${customer.firstName}"
                                        th:data-lastname="${customer.lastName}"
                                        th:data-email="${customer.email}"
                                        th:data-phone="${customer.phone}"
                                        th:data-address="${customer.address}"
                                        th:data-password="${customer.password}"
                                        class="text-indigo-600 hover:text-indigo-900 customer-edit-btn">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <form th:action="@{/customers/delete/{id}(id=${customer.customerId})}" method="GET"
                                      class="inline delete-customer-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="text-red-600 hover:text-red-900">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div class="flex flex-wrap items-center justify-center mt-4 w-full max-w-full gap-4 px-2">
                <a th:href="@{|/customers?page=${currentPage - 1}&size=5|}"
                   th:if="${currentPage > 0}"
                   class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300 whitespace-nowrap">
                    Previous
                </a>

                <div class="flex flex-wrap justify-center gap-3 max-w-full overflow-x-auto no-scrollbar" style="max-width: 600px;">
                    <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                       th:href="@{|/customers?page=${pageNum}&size=5|}"
                       th:text="${pageNum + 1}"
                       th:classappend="${pageNum == currentPage} ? 'bg-blue-500 text-white' : ''"
                       class="px-4 py-2 text-sm font-medium rounded bg-gray-200 text-gray-600 hover:bg-blue-600 hover:text-white whitespace-nowrap">
                    </a>
                </div>

                <a th:href="@{|/customers?page=${currentPage + 1}&size=5|}"
                   th:if="${currentPage < totalPages - 1}"
                   class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300 whitespace-nowrap">
                    Next
                </a>
            </div>
        </div>
    </div>
    <div id="customerModal" class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 hidden items-center justify-center">
        <div th:replace="~{fragments/modals/customer-input-modal}"></div>
    </div>
</div>

<th:block th:fragment="page-scripts">
    <script th:src="@{/js/pages/customer-page.js}"></script>
</th:block>
</body>
</html>
