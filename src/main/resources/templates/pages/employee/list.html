<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: base(~{::body})}">
<body>
<div th:fragment="content" class="flex-1 overflow-auto p-6">
    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Employees</h2>
                <div class="flex space-x-3">
                    <button id="btnAddEmployee"
                            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        Add Employee
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Position</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"></th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                    </thead>
                    <tbody th:each="employee : ${employees}" class="bg-white divide-y divide-gray-200">
                    <tr class="hover:bg-gray-50">
                        <td th:text="${employee.id}" class="px-6 py-4 text-sm font-medium text-gray-900"></td>
                        <td th:text="${employee.name}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${employee.phone}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${employee.email}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td>
                <span th:text="${employee.position}"
                      class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"></span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500" th:text="${employee.phone}"></td>
                        <td class="px-6 py-4 text-sm font-medium">
                            <div class="flex space-x-3">
                                <button type="button"
                                        th:data-id="${employee.id}"
                                        th:data-name="${employee.name}"
                                        th:data-phone="${employee.phone}"
                                        th:data-email="${employee.email}"
                                        th:data-image="${employee.image}"
                                        th:data-position="${employee.position}"
                                        class="btnEditEmployee text-indigo-600 hover:text-indigo-900">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                                   class="btnDeleteEmployee text-red-600 hover:text-red-900">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <!--  Pagination -->
                <div class="flex items-center justify-between mt-4">
                    <!-- Previous Button -->
                    <a th:href="@{|/employees?page=${currentPage - 1}&size=5|}"
                       th:if="${currentPage > 0}"
                       class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300">
                        Previous
                    </a>

                    <!-- Page Numbers -->
                    <div class="flex space-x-2">
                        <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                           th:href="@{|/employees?page=${pageNum}&size=5|}"
                           th:text="${pageNum + 1}"
                           th:classappend="${pageNum == currentPage} ? 'bg-blue-500 text-white' : ''"
                           class="px-4 py-2 text-sm font-medium rounded bg-gray-200 text-gray-600 hover:bg-blue-600 hover:text-white">
                        </a>
                    </div>

                    <!-- Next Button -->
                    <a th:href="@{|/employees?page=${currentPage + 1}&size=5|}"
                       th:if="${currentPage < totalPages - 1}"
                       class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300">
                        Next
                    </a>
                </div>

            </div>
        </div>
    </div>
    <div id="employeeModal" class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 hidden items-center justify-center">
        <div th:replace="~{fragments/modals/employee-input-modal}"></div>
    </div>
</div>

<th:block th:fragment="page-scripts">
    <script th:src="@{/js/pages/employee-page.js}" defer></script>
</th:block>
</body>
</html>
