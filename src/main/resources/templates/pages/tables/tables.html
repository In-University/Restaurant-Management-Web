<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: base(~{::body})}">
<body>
<div th:fragment="content" class="flex-1 overflow-auto p-6">
    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Tables</h2>
                <div class="flex space-x-3">
                    <button id="btnAddTable"
                            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        Add Table
                    </button>
                    <button class="border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-filter mr-2"></i>Filters
                    </button>
                    <button class="border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors">
                        Download all
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Table ID
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Table Number
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Table Capacity
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Status
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"></th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Actions
                        </th>
                    </tr>
                    </thead>
                    <tbody th:each="diningTable : ${tables}" class="bg-white divide-y divide-gray-200">
                    <tr class="hover:bg-gray-50">
                        <td th:text="${diningTable.id}" class="px-6 py-4 text-sm font-medium text-gray-900"></td>
                        <td th:text="${diningTable.tableNumber}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td th:text="${diningTable.capacity}" class="px-6 py-4 text-sm text-gray-500"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                <span th:text="${diningTable.status}"
                      class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"></span>
                        </td>
                        <td></td>
                        <td class="px-6 py-4 text-sm font-medium">
                            <div class="flex space-x-3">
                                <button type="button"
                                        th:data-id="${diningTable.id}"
                                        th:data-number="${diningTable.tableNumber}"
                                        th:data-capacity="${diningTable.capacity}"
                                        th:data-status="${diningTable.status}"
                                        th:data-imageUrl="${diningTable.qrCodeUrl}"
                                        class="btnEditTable text-indigo-600 hover:text-indigo-900">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <a th:href="@{/tables/delete/{id}(id=${diningTable.id})}"
                                   class="text-red-600 hover:text-red-900 btnDeleteTable">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <!-- Pagination -->
                <div class="flex flex-wrap items-center justify-center mt-4 w-full max-w-full gap-4 px-2">
                    <a th:href="@{|/tables?page=${currentPage - 1}&size=5|}"
                       th:if="${currentPage > 0}"
                       class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300 whitespace-nowrap">
                        Previous
                    </a>

                    <div class="flex flex-wrap justify-center gap-3 max-w-full overflow-x-auto no-scrollbar" style="max-width: 600px;">
                        <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                           th:href="@{|/tables?page=${pageNum}&size=5|}"
                           th:text="${pageNum + 1}"
                           th:classappend="${pageNum == currentPage} ? 'bg-blue-500 text-white' : ''"
                           class="px-4 py-2 text-sm font-medium rounded bg-gray-200 text-gray-600 hover:bg-blue-600 hover:text-white whitespace-nowrap">
                        </a>
                    </div>

                    <a th:href="@{|/tables?page=${currentPage + 1}&size=5|}"
                       th:if="${currentPage < totalPages - 1}"
                       class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300 whitespace-nowrap">
                        Next
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div id="tableModal"
         class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 hidden items-center justify-center">
        <div th:replace="~{fragments/modals/table-input-modal}"></div>
    </div>
</div>

<th:block th:fragment="page-scripts">
    <script th:src="@{/js/pages/table-page.js}" defer></script>
</th:block>
</body>
</html>
